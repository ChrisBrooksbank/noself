simpleBrief: >
    A complete meditation system taught by the Buddha, using the natural breath as
    the single object of practice. By following sixteen contemplations across four
    stages, the practitioner moves from calming the body to releasing the mind entirely.

brief: |
    The practice of mindfulness of breathing — a complete path from bodily calm through emotional clarity to full liberation of mind, outlined by the Buddha in sixteen contemplations across four foundations.

essentials: |
    Ānāpānasati is among the most celebrated practices in the Pali Canon. The Buddha taught it in the Ānāpānasati Sutta (MN 118), where he declared that "mindfulness of breathing, developed and cultivated, fulfils the four foundations of mindfulness; the four foundations of mindfulness, developed and cultivated, fulfil the seven factors of awakening; the seven factors of awakening, developed and cultivated, fulfil true knowledge and liberation."

    The practice is structured as sixteen contemplations (anupassanā) arranged in four groups of four — called tetrads. Each tetrad corresponds to one of the four foundations of mindfulness (satipaṭṭhāna):

    **First Tetrad — Body (Kāya):** The practitioner observes the breath in its raw physicality. They know a long breath as long, a short breath as short. They then train to experience the whole body with each breath, and finally to calm the bodily formations — the physical patterns of tension that arise with breathing.

    **Second Tetrad — Feelings (Vedanā):** As bodily agitation settles, more subtle qualities become available: the rapture (pīti) and pleasure (sukha) that arise in deep stillness. One learns to recognise these feeling-tones, then to calm and release them rather than cling.

    **Third Tetrad — Mind (Citta):** The practitioner turns attention to the mind itself — its quality, whether gladdened or contracted, concentrated or scattered. They train to concentrate the mind fully and then to liberate it from whatever still constricts it.

    **Fourth Tetrad — Dharmas (Dhammā):** In the final tetrad the practice becomes explicitly insight-oriented. One contemplates impermanence (anicca), fading away (virāga), cessation (nirodha), and relinquishment (paṭinissagga) — the breath itself becoming a direct gateway to seeing the nature of all conditioned phenomena.

    The sixteen steps are not strictly sequential stages that must be mastered one at a time. They represent a natural deepening that unfolds as practice matures. The breath is the single thread running through all sixteen; the practitioner never leaves it.

deep: |
    The Ānāpānasati Sutta (MN 118) was delivered to a large assembly of monks during the rains retreat. The Buddha opened with unusual praise: the assembled monks, he said, were "non-negligent, ardent, and resolute." He then laid out the sixteen steps and made a sweeping claim — that this one practice, fully developed, can fulfil the entire path to awakening.

    **The Sixteen Contemplations in full:**

    *First Tetrad — Body:*
    1. Breathing in long, one knows "I breathe in long." Breathing out long, one knows "I breathe out long."
    2. Breathing in short, one knows "I breathe in short." Breathing out short, one knows "I breathe out short."
    3. "I shall breathe in experiencing the whole body." "I shall breathe out experiencing the whole body."
    4. "I shall breathe in calming bodily formation." "I shall breathe out calming bodily formation."

    *Second Tetrad — Feelings:*
    5. "I shall breathe in experiencing rapture." "I shall breathe out experiencing rapture."
    6. "I shall breathe in experiencing pleasure." "I shall breathe out experiencing pleasure."
    7. "I shall breathe in experiencing mental formation." "I shall breathe out experiencing mental formation."
    8. "I shall breathe in calming mental formation." "I shall breathe out calming mental formation."

    *Third Tetrad — Mind:*
    9. "I shall breathe in experiencing the mind." "I shall breathe out experiencing the mind."
    10. "I shall breathe in gladdening the mind." "I shall breathe out gladdening the mind."
    11. "I shall breathe in concentrating the mind." "I shall breathe out concentrating the mind."
    12. "I shall breathe in liberating the mind." "I shall breathe out liberating the mind."

    *Fourth Tetrad — Dharmas:*
    13. "I shall breathe in contemplating impermanence." "I shall breathe out contemplating impermanence."
    14. "I shall breathe in contemplating fading away." "I shall breathe out contemplating fading away."
    15. "I shall breathe in contemplating cessation." "I shall breathe out contemplating cessation."
    16. "I shall breathe in contemplating relinquishment." "I shall breathe out contemplating relinquishment."

    **On pīti and sukha:** The distinction in steps 5 and 6 is psychologically precise. Pīti (rapture) is an energised, often physically felt quality — sometimes described as goosebumps, a spreading warmth, or a sense of uplift. Sukha (pleasure/happiness) is quieter — a settled contentment. As concentration deepens, pīti fades and sukha remains, eventually giving way to equanimity.

    **On cittasaṅkhāra:** In step 7, "mental formation" refers to feeling and perception, which the Abhidhamma identifies as the formations that condition the mind. Being aware of how feeling-tone colours each moment of experience is a subtle but crucial shift — from being swept along by mental weather to observing it.

    **On the fourth tetrad:** These four contemplations parallel the insight sequence taught throughout the Pali Canon. Aniccānupassanā (contemplating impermanence) leads naturally to virāgānupassanā (seeing the fading, the disenchantment that comes from clear seeing). From fading comes nirodhānupassanā (seeing cessation — not just of the breath but of all arising). And from cessation, paṭinissaggānupassanā — relinquishment, letting go, throwing back. In the later tradition, these are sometimes glossed as the three gateways to liberation.

    **Ānāpānasati in comparative context:** The Vimuttimagga and the Visuddhimagga (5th century commentaries) elaborate ānāpānasati into extensive systems for developing the jhānas. In the Tibetan tradition, the nine-stage calm abiding (śamatha) practice often uses the breath as its basis. In the Zen tradition, breath-counting (susokukan) and breath-following (zuisokukan) are the entry points to concentrated sitting. Almost every Buddhist school has preserved the breath as the foundational object, and the sixteen-step structure of MN 118 remains its most complete classical articulation.

examples:
    - source: 'Ānāpānasati Sutta (MN 118)'
      text: |
          "Monks, this mindfulness of breathing, when developed and cultivated,
          is of great fruit and great benefit. Mindfulness of breathing, when
          developed and cultivated, fulfils the four foundations of mindfulness.
          The four foundations of mindfulness, when developed and cultivated,
          fulfil the seven factors of awakening. The seven factors of awakening,
          when developed and cultivated, fulfil true knowledge and liberation."
      commentary: |
          The Buddha's own summary of why this single practice contains the whole path.
          It is not one technique among many but a complete vehicle — each stage
          opening naturally into the next.
    - source: 'Thich Nhat Hanh, Breathe, You Are Alive'
      text: |
          "The breath is the bridge which connects life to consciousness,
          which unites your body to your thoughts. Whenever your mind becomes
          scattered, use your breath as the means to take hold of your mind again."
      commentary: |
          TNH's commentary on the Ānāpānasati Sutta emphasises the unifying
          function of breath-awareness: it is always available, always present,
          always a way back to the body and this moment.
